// ─── CÁLCULO PROPORCIONAL L2L ────────────────────────────────────────────────
const calcL2LMes = (valor, ativacao, mesAlvo) => {
  if (!ativacao) return valor;
  const ativMes = ativacao.slice(0, 7);
  if (mesAlvo !== ativMes) return valor;
  const dataAtiv = new Date(ativacao);
  const ano = parseInt(ativMes.slice(0, 4));
  const mes = parseInt(ativMes.slice(5, 7));
  const diasNoMes = new Date(ano, mes, 0).getDate();
  const diaAtiv = dataAtiv.getDate();
  const diasRestantes = diasNoMes - diaAtiv + 1;
  return parseFloat((valor * diasRestantes / diasNoMes).toFixed(2));
};

// Verifica se um mês/valor já foi processado (dia 10 do mês seguinte já passou)
const mesJaProcessado = mesKey => {
  const hoje = new Date();
  const [y, m] = mesKey.split("-").map(Number);
  // Dia 10 do mês seguinte
  const proxMes = m === 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, "0")}`;
  const dia10ProxMes = new Date(`${proxMes}-10`);
  return hoje >= dia10ProxMes;
};

// Retorna {fat, cus, fatPend, cusPend} acumulados de um ponto
const calcL2LAcum = p => {
  if (!p.ativacao) return {
    fat: parseFloat(p.faturamento) || 0,
    cus: parseFloat(p.custo) || 0,
    fatPend: 0,
    cusPend: 0
  };
  const hoje = new Date();
  const ini = new Date(p.ativacao);
  let fat = 0,
    cus = 0,
    fatPend = 0,
    cusPend = 0;
  let y = ini.getFullYear(),
    m = ini.getMonth() + 1;
  while (y < hoje.getFullYear() || y === hoje.getFullYear() && m <= hoje.getMonth() + 1) {
    const mesKey = `${y}-${String(m).padStart(2, "0")}`;
    // Faturamento: sempre valor cheio (sem proporcional)
    const vFat = parseFloat(p.faturamento) || 0;
    // Custo: proporcional no primeiro mês
    const vCus = calcL2LMes(parseFloat(p.custo) || 0, p.ativacao, mesKey);
    if (mesJaProcessado(mesKey)) {
      fat += vFat;
      cus += vCus;
    } else {
      fatPend += vFat;
      cusPend += vCus;
    }
    m++;
    if (m > 12) {
      m = 1;
      y++;
    }
  }
  return {
    fat,
    cus,
    fatPend,
    cusPend
  };
};

const uploadArquivo = async (file, path) => {
  const formData = new FormData();
  formData.append("file", file);
  const res = await fetch(`${SB_STORAGE_URL}/object/sir-orcamentos/${path}`, {
    method: "POST",
    headers: {
      "apikey": SB_KEY,
      "Authorization": "Bearer " + SB_KEY

    body: formData
  });
  if (!res.ok) {
    const e = await res.text();
    console.error("Upload error:", e);
    return null;
  }
  return `${SB_STORAGE_URL}/object/public/sir-orcamentos/${path}`;
};

const SB_STORAGE_URL = SB_URL + "/storage/v1";
async function sbFetch(table, method = "GET", body = null, query = "", extraHeaders = {}) {
  const url = SB_URL + "/rest/v1/" + table + (query ? "?" + query : "");
  const headers = {
    "apikey": SB_KEY,
    "Authorization": "Bearer " + SB_KEY,
    "Content-Type": "application/json",
    ...extraHeaders
  };
  const res = await fetch(url, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) {
    const e = await res.text();
    console.error("SB [" + table + "] " + method + ":", e);
    return null;
  }
  if (method === "DELETE" || res.status === 204) return true;
  const txt = await res.text();
  if (!txt) return true;
  try {
    return JSON.parse(txt);
  } catch (e) {
    return null;
  }
}
